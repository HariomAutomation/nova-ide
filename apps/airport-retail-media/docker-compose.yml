services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airport-retail-media
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      # node, not wget: on alpine wget is busybox's and --spider is not reliable
      # there, and a failing healthcheck shows up as an unhealthy container rather
      # than as a working demo. Same probe as the Dockerfile.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||4000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
