services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airport-retail-media
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
